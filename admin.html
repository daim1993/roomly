<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Roomly — Admin console</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="mark">R</span> roomly <span class="sub">admin console</span></div>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="dbChip" class="dbchip">…</span>
      <a class="back" href="/">← Back to the app</a>
    </div>
  </header>

  <div id="gate"><h2>Platform admins only</h2><p class="muted">Sign in with a platform-admin account, then come back. <a href="/">Go to Roomly</a></p></div>

  <div id="panel" style="display:none">
    <h1>Instance control</h1>
    <div class="cards" id="cards"></div>

    <section>
      <div class="sec-head">
        <h2>Accounts</h2>
        <input id="userSearch" type="search" placeholder="Search name or username…">
      </div>
      <div style="overflow-x:auto"><table id="userTable">
        <thead><tr><th>User</th><th class="hide-sm">Created</th><th>Status</th><th class="hide-sm">Owns</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>

    <section>
      <div class="sec-head"><h2>Servers</h2></div>
      <div style="overflow-x:auto"><table id="serverTable">
        <thead><tr><th>Server</th><th>Owner</th><th>Members</th><th class="hide-sm">Channels</th><th>Type</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table></div>
    </section>
  </div>
</div>
<div id="toast"></div>
<script src="/admin-console.js"></script>
</body>
</html>
